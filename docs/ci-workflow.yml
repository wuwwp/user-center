# 当前 PAT 缺少 workflow scope，先以草案形式保存。
# 授权后执行：mkdir -p .github/workflows && cp docs/ci-workflow.yml .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

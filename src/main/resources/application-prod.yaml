server:
  # 仅在可信反向代理（Nginx）之后启用，避免直接暴露时被伪造 X-Forwarded-For
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info

user-center:
  mail:
    # 生产只允许真实发信；log 实现已用 @Profile("!prod") 排除，误配 log 会启动失败
    mode: ${MAIL_MODE:smtp}

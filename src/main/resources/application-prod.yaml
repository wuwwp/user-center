server:
  # Tomcat RemoteIpValve 解析 X-Forwarded-*：remoteAddr 设为真实客户端并修正 scheme，
  # 同时改写/移除 X-Forwarded-For；应用层只读 remoteAddr
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info

user-center:
  mail:
    # 生产只允许真实发信；log 实现已用 @Profile("!prod") 排除，误配 log 会启动失败
    mode: ${MAIL_MODE:smtp}

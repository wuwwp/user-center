server:
  # 仅在可信反向代理（Nginx）之后启用，避免直接暴露时被伪造 X-Forwarded-For
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info

user-center:
  mail:
    # 生产默认真实发信；缺少 SMTP 配置时启动失败，避免静默不投递或把验证码写进日志
    mode: ${MAIL_MODE:smtp}

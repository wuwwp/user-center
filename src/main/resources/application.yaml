server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: user-center
  profiles:
    active: dev,local
  autoconfigure:
    # 使用自定义 JWT 鉴权链，不需要 Boot 生成的默认内存用户
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/usercenter?useUnicode=true&characterEncoding=utf8&serverTimezone=${USER_CENTER_TIME_ZONE:Asia/Shanghai}&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:usercenter}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    # 生产只跑版本化迁移；开发 profile 会追加 classpath:db/dev
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    time-zone: ${USER_CENTER_TIME_ZONE:Asia/Shanghai}
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto

user-center:
  mail:
    # log=验证码写日志（开发）；smtp=真实发信（生产）
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:用户中心}
  # 每日限发等日期逻辑使用的时区，不依赖 JVM 默认时区
  time-zone: ${USER_CENTER_TIME_ZONE:Asia/Shanghai}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 2h
  cors:
    # 开发时 Vite 可能以 localhost 或 127.0.0.1 打开，两者都放行；生产通过环境变量覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
